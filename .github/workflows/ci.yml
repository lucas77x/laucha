name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb

      - name: Format
        run: test -z "$(gofmt -l internal assets main.go)"

      - name: Vet
        run: go vet ./internal/...

      - name: Test
        # xvfb: the hotkey library needs an X display even in tests
        run: xvfb-run -a go test ./internal/...

      - name: Build
        run: go build .
