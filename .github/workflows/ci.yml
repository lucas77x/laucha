name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb

      - name: Format
        run: test -z "$(gofmt -l internal assets main.go)"

      - name: Vet
        run: go vet ./internal/...

      - name: Test with coverage gate (logic packages >= 80%)
        # xvfb: the hotkey library needs an X display even in tests.
        # internal/ui is exempt: it is Fyne rendering glue; its logic
        # lives in extracted, fully tested files.
        run: |
          xvfb-run -a go test -cover ./internal/... 2>&1 | tee coverage.txt
          awk '$1=="ok" && $2 !~ /internal\/ui$/ {
            for (i=1;i<=NF;i++) if ($i ~ /%$/) {
              gsub("%","",$i)
              if ($i+0 < 80) { print "BELOW 80%: "$2" at "$i"%"; bad=1 }
            }
          } END { exit bad }' coverage.txt

      - name: Build
        run: go build .
