name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: laucha version
      description: The version shown in Settings → About, or the release you downloaded.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Distribution and desktop
      placeholder: "Ubuntu 24.04, MATE 1.26"
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session
      options:
        - X11
        - Wayland
        - Not sure
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Run laucha from a terminal and paste anything it printed.
      render: shell
